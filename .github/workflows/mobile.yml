name: Native mobile checks

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "mobile-shell/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "mobile-shell/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Synchronize native project
        run: npm run mobile:sync
      - name: Test and build Android
        run: npm run mobile:build:android
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-studio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synchronize native project
        run: npm run mobile:sync
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -target App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
