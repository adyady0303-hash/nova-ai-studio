name: Build and publish Nova release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      tag:
        description: Optional version tag; defaults to v plus package.json version
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install and synchronize mobile project
        run: |
          npm ci
          npm run mobile:sync
      - name: Read version
        id: version
        run: |
          value=$(node -p "require('./package.json').version")
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build release archive
        id: assets
        run: |
          mkdir -p dist
          zip -r dist/Nova-AI-Studio.zip server.js data-store.js provider-status.js billing.js web-tools.js ai-providers.js ai-quality.js creation-prompts.js business-site.js google-auth.js package.json package-lock.json README.md Start_Nova_AI_Studio.bat public Dockerfile docker-compose.yml .env.example render.yaml
          sha256sum dist/Nova-AI-Studio.zip > dist/Nova-AI-Studio.zip.sha256
          cd android
          ./gradlew testDebugUnitTest assembleDebug
          cd ..
          apk_name="Nova-AI-Studio-Android-${{ steps.version.outputs.value }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$apk_name"
          sha256sum "dist/$apk_name" > "dist/$apk_name.sha256"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || format('v{0}', steps.version.outputs.value) }}
        run: |
          gh release create "$RELEASE_TAG" dist/Nova-AI-Studio.zip dist/Nova-AI-Studio.zip.sha256 \
            "dist/${{ steps.assets.outputs.apk_name }}" \
            "dist/${{ steps.assets.outputs.apk_name }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Nova AI Studio $RELEASE_TAG" \
            --generate-notes
