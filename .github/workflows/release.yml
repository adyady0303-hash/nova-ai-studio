name: Build and publish Nova release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example v0.3.0); created from the selected branch if missing
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build release archive
        run: |
          mkdir -p dist
          zip -r dist/Nova-AI-Studio.zip server.js package.json README.md Start_Nova_AI_Studio.bat public
          sha256sum dist/Nova-AI-Studio.zip > dist/Nova-AI-Studio.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/Nova-AI-Studio.zip dist/Nova-AI-Studio.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Nova AI Studio $RELEASE_TAG" \
            --generate-notes

