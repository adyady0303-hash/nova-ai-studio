name: Nova quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check data-store.js
          node --check public/app.js
      - name: Run tests
        env:
          NOVA_TEST_DATABASE_URL: postgresql://nova:nova@localhost:5432/nova_test
        run: npm test
      - name: Validate Python DNS utility if present
        run: |
          if [ -f scripts/configure_namecheap_dns.py ]; then python3 -m py_compile scripts/configure_namecheap_dns.py; fi
