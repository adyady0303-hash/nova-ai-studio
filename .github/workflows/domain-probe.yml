name: Probe public Nova domain

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/domain-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test DNS and public endpoints
        shell: bash
        run: |
          set +e
          host=www.nova-ai-studio.eu
          dns=$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u | paste -sd, -)
          version_body=$(mktemp)
          health_body=$(mktemp)
          version_status=$(curl --silent --show-error --location --max-time 30 --output "$version_body" --write-out '%{http_code}' "https://$host/api/version")
          version_exit=$?
          health_status=$(curl --silent --show-error --location --max-time 30 --output "$health_body" --write-out '%{http_code}' "https://$host/healthz")
          health_exit=$?
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "dns=${dns:-unresolved}"
            echo "version_exit=$version_exit"
            echo "version_status=${version_status:-000}"
            echo "version_body=$(head -c 500 "$version_body" | tr '\n' ' ')"
            echo "health_exit=$health_exit"
            echo "health_status=${health_status:-000}"
            echo "health_body=$(head -c 500 "$health_body" | tr '\n' ' ')"
          } > /tmp/nova-domain-probe.txt
          git config user.name "Nova domain probe"
          git config user.email "actions@users.noreply.github.com"
          tag="domain-probe-${GITHUB_SHA:0:7}"
          git tag -a "$tag" -F /tmp/nova-domain-probe.txt "$GITHUB_SHA"
          git push origin "$tag"
