services:
  - type: web
    name: nova-ai-studio
    runtime: docker
    region: oregon
    plan: starter
    domains:
      - www.nova-ai-studio.eu
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NOVA_DATA_DIR
        value: /data
      - key: NOVA_STORAGE_DUAL_WRITE
        value: "true"
      - key: NOVA_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: NOVA_ACCESS_USER
        value: nova
      - key: NOVA_ACCESS_PASSWORD
        generateValue: true
      - key: AI_PROVIDER
        value: openai
      - key: AI_FALLBACK_PROVIDERS
        value: ""
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_SPEECH_MODEL
        value: gpt-4o-mini-tts
      - key: WEB_SEARCH_PROVIDER
        value: auto
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NOVA_MAX_ACCOUNTS
        value: 100
      - key: NOVA_SUBSCRIBER_DAILY_AI_LIMIT
        value: 5
      - key: DATABASE_URL
        fromDatabase:
          name: nova-ai-studio-db
          property: connectionString
    disk:
      name: disk
      mountPath: /data
      sizeGB: 1

databases:
  - name: nova-ai-studio-db
    region: oregon
    plan: 1c-2g
    diskSizeGB: 5
    postgresMajorVersion: "18"
    highAvailability:
      enabled: true
