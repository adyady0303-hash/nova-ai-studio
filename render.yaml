services:
  - type: web
    name: nova-ai-studio
    runtime: docker
    plan: starter
    domains:
      - www.nova-ai-studio.eu
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NOVA_DATA_DIR
        value: /data
      - key: NOVA_ACCESS_USER
        value: nova
      - key: NOVA_ACCESS_PASSWORD
        generateValue: true
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: OPENAI_SPEECH_MODEL
        value: gpt-4o-mini-tts
      - key: NOVA_MAX_ACCOUNTS
        value: 100
      - key: NOVA_SUBSCRIBER_DAILY_AI_LIMIT
        value: 20
    disk:
      name: nova-data
      mountPath: /data
      sizeGB: 1
